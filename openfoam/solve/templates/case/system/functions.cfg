functions
{
    solverInfo_hot
    {
        type            solverInfo;
        libs            (utilityFunctionObjects);
        region          hot;
        fields          (U p_rgh h);
        writeResidualFields no;
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    solverInfo_cold
    {
        type            solverInfo;
        libs            (utilityFunctionObjects);
        region          cold;
        fields          (U p_rgh h);
        writeResidualFields no;
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    solverInfo_solid_solid
    {
        type            solverInfo;
        libs            (utilityFunctionObjects);
        region          solid;
        fields          (h);
        writeResidualFields no;
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    mdot_hot_in
    {
        type            surfaceFieldValue;
        libs            (fieldFunctionObjects);
        region          hot;
        regionType      patch;
        name            hot_inlet;
        operation       sum;
        fields          (phi);
        writePrecision  10;
        writeFields     no;
        log             no;
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    p_hot_in
    {
        type            surfaceFieldValue;
        libs            (fieldFunctionObjects);
        region          hot;
        regionType      patch;
        name            hot_inlet;
        operation       areaAverage;
        fields          (p);
        writePrecision  10;
        writeFields     no;
        log             yes;    // measure.py ΔP 파서 (dat와 동일 값)
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    T_hot_in
    {
        type            surfaceFieldValue;
        libs            (fieldFunctionObjects);
        region          hot;
        regionType      patch;
        name            hot_inlet;
        operation       weightedAverage;
        weightField     phi;
        fields          (T);
        writePrecision  10;
        writeFields     no;
        log             no;
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    mdot_hot_out
