# S4 실배선(P-M03 처분): CI 축 = gyrox 사설 컨텍스트 불요 서브셋(test-ci — `-m "not m0_assets"`).
# 전체 make test(m0 수용 기록 포함 — S7 자립 판정 정본)는 캠페인 ⑧ 로컬 재실행·리포트 해시 결속(CP 매니페스트).
name: make-test
on:
  pull_request:
  workflow_dispatch: {}
jobs:
  make-test-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run CI-subset tests in image
        run: make test-ci CI_JUNIT_OUT=$PWD/reports/make-test-ci-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: make-test-ci-report
          path: reports/make-test-ci-report.xml
