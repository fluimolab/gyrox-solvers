    {
        type            surfaceFieldValue;
        libs            (fieldFunctionObjects);
        region          hot;
        regionType      patch;
        name            hot_outlet;
        operation       areaAverage;
        fields          (p);
        writePrecision  10;
        writeFields     no;
        log             yes;    // measure.py ΔP 파서
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    T_hot_out
    {
        type            surfaceFieldValue;
        libs            (fieldFunctionObjects);
        region          hot;
        regionType      patch;
        name            hot_outlet;
        operation       weightedAverage;
        weightField     phi;
        fields          (T);
        writePrecision  10;
        writeFields     no;
        log             yes;    // measure.py T_out 파서 (D-M0-15 질량유량 가중)
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   1;
    }

    whf_hot
    {
        type            wallHeatFlux;
        libs            (fieldFunctionObjects);
        region          hot;
        patches         (hot_to_solid);
        log             yes;    // 에너지 밸런스 모니터 (정본은 dat integral)
        executeControl  timeStep;
        executeInterval 1;
        writeControl    timeStep;
        writeInterval   50;
    }

