# S4(G2) 실배선(P-M03 처분): runtime 타깃은 gyrox 컨텍스트 불요 — CI가 빌드·식별자 기록 산출.
# full/test 이미지·캠페인 3식별자 기록의 정본은 캠페인 ⓪(image-build-record.json·CP 매니페스트 결속).
name: image-build
on:
  pull_request:
  workflow_dispatch: {}
jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build runtime image
        run: make build IMAGE=gyrox/solvers:ci
      - name: Record image identifiers
        run: |
          mkdir -p reports
          docker image inspect gyrox/solvers:ci --format '{{json .}}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(json.dumps({'fullImageId': d['Id'], 'repoDigests': d.get('RepoDigests') or None, 'baseAnchor3': 'sha256:33fb575aa9980d2bc42fd58c75ae698c489293ba30c991380fe3f899c622f319'}, indent=1))" > reports/image-build-ci-record.json
          cat reports/image-build-ci-record.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-build-ci-record
          path: reports/image-build-ci-record.json
